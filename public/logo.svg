    <path d="M55 24C62 10 74 12 73 22C63 26 58 24 55 24Z" fill="#52B824" stroke="#2B1608" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Green 'f' Sprout Body -->
    <path d="M36 28C36 20 44 17 52 17C57 17 59 20 59 26C59 38 56 46 56 47H45V60H53V72H45V92C45 98 42 102 38 104C34 102 33 97 33 92V38C33 32 34 29 36 28Z" fill="#54B82A" stroke="#2B1608" stroke-width="4" stroke-linejoin="round" />
    
    <!-- 'm' branch on left -->
    <path d="M33 66L23 60C20 58 16 63 19 66L20 72C22 75 26 73 28 71" stroke="#6F4223" stroke-width="4" stroke-linecap="round" />
    <path d="M16 62C14 62 12 65 14 68C16 71 18 70 20 67" stroke="#6F4223" stroke-width="3" stroke-linecap="round" />
    
