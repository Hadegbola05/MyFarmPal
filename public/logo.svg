    <!-- Roots for Green Sprout 'f' -->
    <path d="M38 102C38 108 34 113 28 116M28 116L22 124M28 116L30 125M28 116L35 123" stroke="#2B1608" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
