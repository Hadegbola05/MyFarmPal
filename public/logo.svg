    <path d="M65 32C65 24 73 20 84 20C96 20 102 28 102 38C102 48 94 56 83 56H75V92C75 98 71 103 66 105C61 103 61 98 61 92V38C61 34 63 32 65 32Z" fill="#FFBD0A" stroke="#2B1608" stroke-width="4" stroke-linejoin="round" />
    
