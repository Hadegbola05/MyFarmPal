    <path d="M75 32H83C88 32 92 35 92 40C92 45 88 48 83 48H75V32Z" fill="#FFF2B2" stroke="#2B1608" stroke-width="3.5" />
    
    <!-- Sprout Face (Eyes & Smiles) -->
    <circle cx="43" cy="38" r="3" fill="#2B1608" />
    <circle cx="51" cy="38" r="3" fill="#2B1608" />
    <path d="M44 43C46 45 49 45 51 43" stroke="#2B1608" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Yellow P Face (Eyes & Smiles) -->
    <circle cx="78" cy="38" r="3" fill="#2B1608" />
    <circle cx="89" cy="39" r="3" fill="#2B1608" />
    <path d="M80 43C83 46 86 46 88 43" stroke="#2B1608" stroke-width="2.5" stroke-linecap="round" />
    <path d="M81 50C85 52 89 50 90 49" stroke="#2B1608" stroke-width="2.5" stroke-linecap="round" />
